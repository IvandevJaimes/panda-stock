appId: com.pandastock.pos
productName: Panda Stock
copyright: Copyright © 2026 Panda Stock

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - electron/db/migrations/**

asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

npmRebuild: true
electronLanguages:
  - es

win:
  # Fuente unica del logo: el mismo PNG que usa la app en pantalla.
  # electron-builder convierte a .ico solo. Pide minimo 256x256 y este es de 500.
  icon: public/panda-stock-logo-512x512.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Panda Stock

mac:
  # Derivado del logo de public, no un icono aparte: el original mide 500x500 y
  # para .icns electron-builder exige 512 como minimo. build/icon-mac.png es ese
  # mismo PNG reescalado a 512.
  icon: build/icon-mac.png
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  icon: public/panda-stock-logo-512x512.png
  category: Office
  maintainer: Panda Stock
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64