appId: com.pandastock.pos
productName: Panda Stock
copyright: Copyright © 2026 Panda Stock

directories:
  output: release
  buildResources: build

# Icono unico del proyecto, para las tres plataformas. electron-builder lo
# convierte a .ico y .icns por su cuenta.
# OJO: el generador de .icns NO falla con una imagen chica, descarta en
# silencio los frames que no entran (icns.ts: ICNS_ENTRIES.filter(size <=
# sourceSize)). Con menos de 512 el .icns se queda en 256 y macOS lo muestra
# borroso en Retina sin avisar. Por eso este PNG tiene que medir 512 de verdad.
icon: public/panda-stock-logo-512x512.png

files:
  - dist/**
  - dist-electron/**
  - electron/db/migrations/**

asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

npmRebuild: true
electronLanguages:
  - es

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Panda Stock

mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  category: Office
  maintainer: Panda Stock
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64